{% extends 'base.html' %}
{% load static %}
{% block title %}{{ tema.nombre }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="text-center mb-3">{{ tema.nombre }}</h2>
        <p class="text-center">{{ tema.descripcion }}</p>

        <!-- Carrusel -->
        <div id="carouselTema" class="carousel slide shadow rounded" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="{% static tema.imagenes.0 %}" class="d-block w-100 rounded" alt="Imagen 1" style="height: 400px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="{% static tema.imagenes.1 %}" class="d-block w-100 rounded" alt="Imagen 2" style="height: 400px; object-fit: cover;">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselTema" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselTema" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'inicio_benavides:home' %}" class="btn btn-secondary">Volver al Inicio</a>
        </div>
    </div>
</div>
{% endblock %}
