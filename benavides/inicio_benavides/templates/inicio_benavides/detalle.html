{% extends 'base.html' %}
{% load static %}
{% block title %}{{ tema.nombre }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">

        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold text-dark">{{ tema.nombre }}</h1>
            <p class="lead text-muted px-3">{{ tema.descripcion }}</p>
        </div>


        <div id="carouselTema" class="carousel slide shadow-lg rounded overflow-hidden bg-dark" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="d-flex justify-content-center align-items-center" style="min-height: 450px;">
                        <img src="{% static tema.imagenes.0 %}" class="d-block img-fluid" alt="Imagen 1 de {{ tema.nombre }}" style="max-height: 500px; object-fit: contain;">
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex justify-content-center align-items-center" style="min-height: 450px;">
                        <img src="{% static tema.imagenes.1 %}" class="d-block img-fluid" alt="Imagen 2 de {{ tema.nombre }}" style="max-height: 500px; object-fit: contain;">
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselTema" data-bs-slide="prev">
                <span class="carousel-control-prev-icon bg-secondary rounded-circle p-3" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselTema" data-bs-slide="next">
                <span class="carousel-control-next-icon bg-secondary rounded-circle p-3" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>


        <div class="text-center mt-4">
            <a href="{% url 'inicio_benavides:home' %}" class="btn btn-outline-dark px-4 py-2">Volver al Inicio</a>
        </div>
    </div>
</div>
{% endblock %}
